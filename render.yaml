services:
  - type: web
    name: vishwas-silk-api-mohammedtahairp
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: vishwas-silk-mohammedtahairp
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vishwas-silk-api-mohammedtahairp.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
