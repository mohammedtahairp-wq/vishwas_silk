services:
  postgres:
    image: postgres:16-alpine
    container_name: vishwas_silk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vishwas
      POSTGRES_PASSWORD: vishwas_dev_pw
      POSTGRES_DB: vishwas_silk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vishwas -d vishwas_silk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
